<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dunamus Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PANTALLA DE EDAD -->

    <section id="edad" class="pantalla">

        <div class="caja">

            <h1>DUNAMUS HUB</h1>

            <p>¿Eres mayor de 18 años?</p>

            <div class="botones">

                <button id="entrar">
                    Sí, soy mayor de 18
                </button>

                <button id="salir">
                    No, soy menor
                </button>

            </div>

        </div>

    </section>


    <!-- PÁGINA PRINCIPAL -->

    <main id="pagina" class="oculto">

        <header>

            <h1>DUNAMUS HUB</h1>

            <p>ven a divertirte BRAZZERS IS FREE</p>

        </header>


        <section class="perfiles">


            <!-- PERFIL SWEETIE DUMIUS -->

            <div class="perfil">

                <a href="https://example.com" class="enlace-secreto">
                    SECRETO
                </a>

                <div class="foto">
                    SD
                </div>

                <h2>
                    Sweetie Dumius
                </h2>

                <button class="ver-perfil">
                    Entrar
                </button>

            </div>


            <!-- PERFIL SUAREZ KALIFA -->

            <div class="perfil">

                <div class="foto">
                    SK
                </div>

                <h2>
                    Suarez Kalifa
                </h2>

                <button class="ver-perfil">
                    Entrar
                </button>

            </div>


        </section>

    </main>


    <!-- MODAL TROLL -->

    <div id="troll" class="modal oculto">

        <div class="modal-caja">

            <img
                src="mono.png"
                alt="Mono haciendo un gesto burlón"
                class="mono"
            >

            <div class="emoji">
                🐷
            </div>

            <h1>
                PAJERO CHANCHO
            </h1>

            <p>
                ¿De verdad pensaste que ibas a encontrar algo aquí?
            </p>

            <div class="ip">

                IP detectada:
                <strong>
                    192.0.2.123
                </strong>

            </div>

            <p class="pequeno">
                duerme con un ojo abierto
            </p>

            <button id="cerrar">
                Volver
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
